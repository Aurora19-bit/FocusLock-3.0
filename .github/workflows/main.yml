name: Build FocusLock APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Download & Restore FocusLock 3.0 Codebase
        run: |
          echo "==> Fetching FocusLock 3.0 updated codebase..."
          curl -sL "https://dpaste.com/9THY7NRJN.txt" | base64 -d | tar -xz
          
          echo "==> Ensuring Resource Directories & Icons..."
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/xml
          
          # Ensure both standard and round icons exist to satisfy Android AAPT resource linking
          if [ -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml ]; then
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi
          
          echo "==> Restored code structure:"
          ls -la app/src/main/java/com/vidhya/focuslock/
          ls -la app/src/main/res/mipmap-anydpi-v26/

          echo "==> Compiling FocusLock 3.0 APK..."
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload FocusLock APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
