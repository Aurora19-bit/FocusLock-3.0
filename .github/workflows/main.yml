name: Build FocusLock APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Verify & Auto-repair Project Structure
        run: |
          echo "=== 1. Checking Directory Layout ==="
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          echo "=== 2. Ensuring AndroidManifest.xml exists and has foregroundService property ==="
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            FOUND_MANIFEST=$(find . -name "AndroidManifest.xml" -not -path "*/app/src/main/*" | head -n 1)
            if [ -n "$FOUND_MANIFEST" ]; then
              cp "$FOUND_MANIFEST" app/src/main/AndroidManifest.xml
            fi
          fi
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "PROPERTY_SPECIAL_USE_FGS_SUBTYPE" "app/src/main/AndroidManifest.xml"; then
              sed -i 's|<service android:name=".SessionTimerService"[^>]*>|&\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="FocusLock timer" />|g' app/src/main/AndroidManifest.xml 2>/dev/null || true
            fi
          fi

          echo "=== 3. Ensuring Drawables and Launcher Icons exist ==="
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,32a12,12 0 0,0 -12,12v8h-2a6,6 0 0,0 -6,6v22a6,6 0 0,0 6,6h28a6,6 0 0,0 6,-6v-22a6,6 0 0,0 -6,-6h-2v-8a12,12 0 0,0 -12,-12zm0,6a6,6 0 0,1 6,6v8h-12v-8a6,6 0 0,1 6,-6z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,32a12,12 0 0,0 -12,12v8h-2a6,6 0 0,0 -6,6v22a6,6 0 0,0 6,6h28a6,6 0 0,0 6,-6v-22a6,6 0 0,0 -6,-6h-2v-8a12,12 0 0,0 -12,-12zm0,6a6,6 0 0,1 6,6v8h-12v-8a6,6 0 0,1 6,-6z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#131B2E" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#1E293B" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/emerald_dark" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "=== 4. Ensuring strings.xml exists (resolves string/app_name) ==="
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">FocusLock</string>
              <string name="device_admin_label">FocusLock Admin Guard</string>
              <string name="device_admin_description">Prevents unauthorized removal of FocusLock while a focus session is actively running.</string>
          </resources>
          EOF
          fi

          echo "=== 5. Ensuring colors.xml exists ==="
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="emerald_primary">#10B981</color>
              <color name="emerald_dark">#047857</color>
              <color name="red_danger">#EF4444</color>
              <color name="bg_dark">#0F172A</color>
          </resources>
          EOF
          fi

          echo "=== 6. Ensuring themes.xml exists (resolves style/Theme.FocusLock) ==="
          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.FocusLock" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/emerald_primary</item>
                  <item name="colorPrimaryVariant">@color/emerald_dark</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSecondary">@color/emerald_primary</item>
                  <item name="colorSecondaryVariant">@color/emerald_dark</item>
                  <item name="colorOnSecondary">@color/white</item>
                  <item name="android:statusBarColor">@color/bg_dark</item>
                  <item name="android:navigationBarColor">@color/bg_dark</item>
              </style>
              <style name="Theme.FocusLock.Fullscreen" parent="Theme.FocusLock">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="Theme.FocusLock.Dialog" parent="Theme.MaterialComponents.DayNight.Dialog">
                  <item name="colorPrimary">@color/emerald_primary</item>
                  <item name="colorSecondary">@color/emerald_primary</item>
              </style>
          </resources>
          EOF
          fi

          echo "=== 7. Ensuring XML configs exist (resolves xml/accessibility_service_config) ==="
          if [ ! -f "app/src/main/res/xml/accessibility_service_config.xml" ]; then
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="false"
              android:description="@string/app_name"
              android:notificationTimeout="50" />
          EOF
          fi

          if [ ! -f "app/src/main/res/xml/device_admin_receiver.xml" ]; then
          cat << 'EOF' > app/src/main/res/xml/device_admin_receiver.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF
          fi

          echo "=== 8. Ensuring layout XMLs exist (resolves activity_main & activity_block) ==="
          if [ ! -f "app/src/main/res/layout/activity_main.xml" ] || grep -q "com.google.android.material.slider.Slider" "app/src/main/res/layout/activity_main.xml" 2>/dev/null; then
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090D16"
              android:fillViewport="true">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp"
                  android:gravity="center_horizontal">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="FocusLock"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:layout_marginTop="16dp" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Strict App Lock &amp; Anti-Distraction Guard"
                      android:textColor="#94A3B8"
                      android:textSize="13sp"
                      android:layout_marginTop="4dp" />
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_card"
                      android:padding="24dp"
                      android:gravity="center"
                      android:layout_marginTop="32dp">
                      <TextView
                          android:id="@+id/tvTimer"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="25:00"
                          android:textColor="#10B981"
                          android:textSize="54sp"
                          android:textStyle="bold" />
                      <TextView
                          android:id="@+id/tvSelectedDuration"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="25 minutes"
                          android:textColor="#64748B"
                          android:textSize="14sp"
                          android:layout_marginTop="4dp" />
                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:layout_marginTop="16dp">
                          <Button
                              android:id="@+id/chip25"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="25m"
                              android:textColor="#E2E8F0"
                              app:strokeColor="#334155" />
                          <Button
                              android:id="@+id/chip45"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="8dp"
                              android:text="45m"
                              android:textColor="#E2E8F0"
                              app:strokeColor="#334155" />
                          <Button
                              android:id="@+id/chip60"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="8dp"
                              android:text="60m"
                              android:textColor="#E2E8F0"
                              app:strokeColor="#334155" />
                      </LinearLayout>
                      <SeekBar
                          android:id="@+id/durationSlider"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:min="5"
                          android:max="180"
                          android:progress="25"
                          android:layout_marginTop="20dp"
                          android:progressTint="#10B981"
                          android:thumbTint="#10B981" />
                  </LinearLayout>
                  <Button
                      android:id="@+id/btnSelectApps"
                      style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:layout_marginTop="20dp"
                      android:text="Configure Blocked Apps"
                      android:textColor="#E2E8F0"
                      app:strokeColor="#334155"
                      app:cornerRadius="14dp" />
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnStartLock"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="16dp"
                      android:text="Lock &amp; Focus Now"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:textSize="16sp"
                      app:backgroundTint="#10B981"
                      app:cornerRadius="16dp" />
              </LinearLayout>
          </ScrollView>
          EOF
          fi

          if [ ! -f "app/src/main/res/layout/activity_block.xml" ]; then
          cat << 'EOF' > app/src/main/res/layout/activity_block.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0A0F1D"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="32dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Focus Session Active"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/tvMessage"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:gravity="center"
                  android:text="This application is locked."
                  android:textColor="#94A3B8"
                  android:textSize="14sp" />
              <com.google.android.material.button.MaterialButton
                  android:id="@+id/btnGoHome"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_marginTop="32dp"
                  android:text="Back to Productive Work" />
              <Button
                  android:id="@+id/btnEmergency"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Emergency Pass (Solve Math)" />
          </LinearLayout>
          EOF
          fi

          if [ ! -f "app/src/main/res/layout/activity_puzzle.xml" ]; then
          cat << 'EOF' > app/src/main/res/layout/activity_puzzle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="24dp"
              android:background="#131B2E">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Mental Resistance Check"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/tvEquation"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="24 * 16 - 32 = ?"
                  android:textColor="#10B981"
                  android:textSize="26sp"
                  android:layout_marginTop="16dp" />
              <EditText
                  android:id="@+id/etAnswer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:inputType="numberSigned"
                  android:hint="Your calculated answer"
                  android:textColor="#FFFFFF"
                  android:layout_marginTop="12dp" />
              <Button
                  android:id="@+id/btnSubmit"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Submit &amp; Unlock (2 mins)"
                  android:layout_marginTop="16dp" />
          </LinearLayout>
          EOF
          fi

      - name: Build FocusLock APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload FocusLock APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
