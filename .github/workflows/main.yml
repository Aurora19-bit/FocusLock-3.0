name: Build FocusLock APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-repair Layout & Verify Manifest
        run: |
          # If files were pushed inside a nested FocusLock folder, move them up
          if [ -d "FocusLock" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Un-nesting FocusLock directory..."
            cp -rn FocusLock/* . 2>/dev/null || cp -r FocusLock/* .
          fi

          mkdir -p app/src/main

          # If manifest exists in another folder, copy to expected location
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            FOUND=$(find . -name "AndroidManifest.xml" -not -path "*/app/src/main/*" | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "Found manifest at $FOUND. Moving to app/src/main/AndroidManifest.xml"
              cp "$FOUND" app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Assemble FocusLock Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload FocusLock APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
