name: Build FocusLock APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-repair Project Structure & Missing Resources
        run: |
          echo "=== 1. Checking repository structure ==="
          if [ -d "FocusLock" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Un-nesting FocusLock directory..."
            cp -rn FocusLock/* . 2>/dev/null || cp -r FocusLock/* .
          fi

          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          echo "=== 2. Ensuring AndroidManifest.xml exists ==="
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            FOUND_MANIFEST=$(find . -name "AndroidManifest.xml" -not -path "*/app/src/main/*" | head -n 1)
            if [ -n "$FOUND_MANIFEST" ]; then
              cp "$FOUND_MANIFEST" app/src/main/AndroidManifest.xml
            fi
          fi

          echo "=== 3. Ensuring Launcher Icons exist (resolves mipmap/ic_launcher) ==="
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,32a12,12 0 0,0 -12,12v8h-2a6,6 0 0,0 -6,6v22a6,6 0 0,0 6,6h28a6,6 0 0,0 6,-6v-22a6,6 0 0,0 -6,-6h-2v-8a12,12 0 0,0 -12,-12zm0,6a6,6 0 0,1 6,6v8h-12v-8a6,6 0 0,1 6,-6z" />
          </vector>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

          echo "=== 4. Ensuring strings.xml exists (resolves string/app_name) ==="
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">FocusLock</string>
              <string name="device_admin_label">FocusLock Admin Guard</string>
              <string name="device_admin_description">Prevents unauthorized removal of FocusLock while a focus session is actively running.</string>
          </resources>
          EOF
          fi

          echo "=== 5. Ensuring colors.xml exists ==="
          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="emerald_primary">#10B981</color>
              <color name="emerald_dark">#047857</color>
              <color name="red_danger">#EF4444</color>
              <color name="bg_dark">#0F172A</color>
          </resources>
          EOF
          fi

          echo "=== 6. Ensuring themes.xml exists (resolves style/Theme.FocusLock) ==="
          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.FocusLock" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/emerald_primary</item>
                  <item name="colorPrimaryVariant">@color/emerald_dark</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="android:statusBarColor">@color/bg_dark</item>
              </style>
              <style name="Theme.FocusLock.Fullscreen" parent="Theme.FocusLock">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="Theme.FocusLock.Dialog" parent="Theme.MaterialComponents.DayNight.Dialog">
                  <item name="colorPrimary">@color/emerald_primary</item>
              </style>
          </resources>
          EOF
          fi

          echo "=== 7. Ensuring XML configs exist ==="
          if [ ! -f "app/src/main/res/xml/accessibility_service_config.xml" ]; then
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="false"
              android:description="@string/app_name"
              android:notificationTimeout="50" />
          EOF
          fi

          if [ ! -f "app/src/main/res/xml/device_admin_receiver.xml" ]; then
          cat << 'EOF' > app/src/main/res/xml/device_admin_receiver.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF
          fi

          echo "=== 8. Ensuring layout XMLs exist ==="
          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090D16"
              android:fillViewport="true">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp"
                  android:gravity="center_horizontal">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="FocusLock"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:layout_marginTop="16dp" />
                  <TextView
                      android:id="@+id/tvTimer"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="25:00"
                      android:textColor="#10B981"
                      android:textSize="54sp"
                      android:textStyle="bold"
                      android:layout_marginTop="24dp" />
                  <TextView
                      android:id="@+id/tvSelectedDuration"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="25 minutes"
                      android:textColor="#64748B"
                      android:textSize="14sp"
                      android:layout_marginTop="4dp" />
                  <Button
                      android:id="@+id/chip25"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="25m"
                      android:visibility="gone" />
                  <Button
                      android:id="@+id/chip45"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="45m"
                      android:visibility="gone" />
                  <Button
                      android:id="@+id/chip60"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="60m"
                      android:visibility="gone" />
                  <com.google.android.material.slider.Slider
                      android:id="@+id/durationSlider"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:valueFrom="5"
                      android:valueTo="180"
                      android:stepSize="5"
                      android:value="25"
                      android:layout_marginTop="16dp" />
                  <Button
                      android:id="@+id/btnSelectApps"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:layout_marginTop="20dp"
                      android:text="Configure Blocked Apps" />
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnStartLock"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="16dp"
                      android:text="Lock &amp; Focus Now" />
              </LinearLayout>
          </ScrollView>
          EOF
          fi

          if [ ! -f "app/src/main/res/layout/activity_block.xml" ]; then
          cat << 'EOF' > app/src/main/res/layout/activity_block.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0A0F1D"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="32dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Focus Session Active"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/tvMessage"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:gravity="center"
                  android:text="This application is locked."
                  android:textColor="#94A3B8"
                  android:textSize="14sp" />
              <com.google.android.material.button.MaterialButton
                  android:id="@+id/btnGoHome"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_marginTop="32dp"
                  android:text="Back to Productive Work" />
              <Button
                  android:id="@+id/btnEmergency"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Emergency Pass (Solve Math)" />
          </LinearLayout>
          EOF
          fi

          if [ ! -f "app/src/main/res/layout/activity_puzzle.xml" ]; then
          cat << 'EOF' > app/src/main/res/layout/activity_puzzle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="#131B2E"
              android:orientation="vertical"
              android:padding="24dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Anti-Impulse Challenge"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/tvEquation"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:gravity="center"
                  android:text="34 × 19 - 42 = ?"
                  android:textColor="#10B981"
                  android:textSize="24sp"
                  android:textStyle="bold" />
              <EditText
                  android:id="@+id/etAnswer"
                  android:layout_width="match_parent"
                  android:layout_height="50dp"
                  android:layout_marginTop="16dp"
                  android:hint="Enter answer"
                  android:inputType="numberSigned" />
              <com.google.android.material.button.MaterialButton
                  android:id="@+id/btnSubmit"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:layout_marginTop="16dp"
                  android:text="Submit &amp; Get 2-Min Pass" />
          </LinearLayout>
          EOF
          fi

          echo "=== 9. Removing package attr deprecation if present ==="
          sed -i 's/package="com.vidhya.focuslock"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true

          echo "Resource layout verified:"
          ls -R app/src/main/res

      - name: Assemble FocusLock Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload FocusLock APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
